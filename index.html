<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irwanda Syafriadi — Portofolio</title>
<meta name="description" content="Portofolio Irwanda Syafriadi, mahasiswa D3 Sistem Informasi.">
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#57534e;--line:#e7e5e4;--accent:#0f766e;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0c0a09;--fg:#f5f5f4;--muted:#a8a29e;--line:#292524;--accent:#2dd4bf;--card:#1c1917}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:72px 20px}
header h1{font-size:clamp(2rem,6vw,3rem);line-height:1.1;letter-spacing:-.02em}
header p{color:var(--muted);margin-top:12px;font-size:1.1rem}
.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.links a{color:var(--fg);text-decoration:none;border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-size:.95rem}
.links a:hover{border-color:var(--accent);color:var(--accent)}
section{margin-top:64px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:12px}
.card h3{font-size:1.1rem}
.card p{color:var(--muted);margin-top:4px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags span{background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:6px;font-size:.9rem}
footer{margin-top:80px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Irwanda Syafriadi</h1>
<p>Mahasiswa D3 Sistem Informasi. Senang membangun aplikasi web yang sederhana dan bermanfaat.</p>
<div class="links">
<a href="https://github.com/irwandasyafriadi">GitHub</a>
</div>
</header>

<section>
<h2>Project</h2>
<div class="card">
<h3>myUKOM</h3>
<p>Website untuk belajar dan persiapan ujian UKOM.</p>
</div>
</section>

<section>
<h2>Skill</h2>
<div class="tags">
<span>HTML</span><span>CSS</span><span>JavaScript</span><span>Git &amp; GitHub</span>
</div>
</section>

<footer>© 2026 Irwanda Syafriadi</footer>
</div>
</body>
</html>
